BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS += "microduck-distro"
BBFILE_PATTERN_microduck-distro := "^${LAYERDIR}/"
BBFILE_PRIORITY_microduck-distro = "20"
# Configuration only, no recipes.
BBFILE_PATTERN_IGNORE_EMPTY_microduck-distro = "1"

LAYERVERSION_microduck-distro = "1"
# The distro policy: conf/distro/microduck.conf, which requires meta-poky's poky.conf.
LAYERDEPENDS_microduck-distro = "core yocto"
LAYERSERIES_COMPAT_microduck-distro = "wrynose"
