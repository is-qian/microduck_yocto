# microduck OS -- portable build definition.
#
# Deliberately contains NO absolute paths, so it is identical on every build
# host. Per-host paths live in kas/host-*.yml and are composed on the command
# line:
#
#   kas-container build kas/microduck.yml:kas/host-coach.yml
#
# Note there is no `poky` repo here. The combined poky repo has no wrynose
# branch (it stops at walnascar), so we use the three repos meta-rockchip's
# README actually names: openembedded-core, meta-yocto and meta-openembedded.
# bitbake is a fourth, checked out as a sibling of openembedded-core, which is
# where oe-buildenv-internal's `$OEROOT/../bitbake` fallback finds it.

header:
  version: 14

distro: poky
machine: microduck-zero3

# The dev image, while we are still bringing the board up: every image built so
# far has gone onto a board that is then reached over ssh, and microduck-image has
# no login at all now that the password-less root feature moved into
# microduck-image-dev.bb. Build the shippable one explicitly:
#
#     HFJOB_TARGET=microduck-image scripts/build-hfjob.sh
#
# Flip this default when there is a product to ship rather than a board to debug.
# sstate makes the other image cheap either way -- only do_rootfs and the image
# tasks differ, every package is shared.
target: microduck-image-dev

# Which microduck_daemon release the image seeds. The recipe has no version of its
# own and is skipped without these; scripts/daemon-release.sh resolves a release
# to the pair, and build-hfjob.sh / build-coach.sh pass it in (README.md, "Which
# daemon the image seeds"). null: forwarded to bitbake when set, nothing otherwise.
env:
  MICRODUCK_DAEMON_VERSION: null
  MICRODUCK_DAEMON_SRCREV: null

repos:
  # This repo. Contributes meta-microduck; no url/commit, kas uses the checkout.
  microduck_os:
    layers:
      meta-microduck:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    commit: f09a0f28aeb54ddd90415dd458338e1565bb5a49
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers:
      # Not a layer -- oe-core requires bitbake >= 2.18.0 and locates it by path.
      .: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c
    layers:
      meta-poky:
      meta-yocto-bsp: disabled

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    commit: af8b6d6b2f0b11595b0a0d5b82efa3129d52a628
    layers:
      meta-oe:            # meta-rockchip depends on this (openembedded-layer)
      meta-python:
      meta-multimedia:
      meta-networking:    # NetworkManager

  meta-rockchip:
    url: https://github.com/JeffyCN/meta-rockchip.git
    branch: wrynose
    commit: 54f31b3987948afc07d2e83cb0ecd981d7476de3

  # A/B OS updates. LAYERDEPENDS is "core" alone, already satisfied, and the
  # layer root is the layer (no `layers:` key needed).
  #
  # Note this is rauc/meta-rauc, which is a different thing from the RAUC demo
  # that lives in the *Yocto Project's* meta-rockchip under
  # dynamic-layers/rk-rauc-demo/. That demo targets this exact board and is the
  # design we copied, but we cannot use the layer itself -- it is JeffyCN's
  # meta-rockchip we need, for the vendor kernel the camera and AIC8800 depend on.
  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: wrynose
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d

local_conf_header:
  microduck: |
    # rockchip-libmali is a redistributable binary blob.
    LICENSE_FLAGS_ACCEPTED = "commercial"

    # Vendor BSP kernel + rkaiq + full GStreamer is comfortably 100 GB+ of
    # TMPDIR without this.
    INHERIT += "rm_work"

    # meta-rauc's sanity-meta-rauc.bbclass warns on every single parse without
    # this. It is not only cosmetic: busybox and curl carry bbappends keyed off
    # the feature (tar long options, and nghttp2 so adaptive updates can pipeline
    # their range requests).
    DISTRO_FEATURES:append = " rauc"

  kernel-shallow: |
    # radxa/kernel is a full Linux history: 13,224,308 objects and 10.7M deltas.
    # A --mirror clone of it died with "fatal: fetch-pack: invalid index-pack
    # output" and is a liability regardless -- a single corrupt byte anywhere in
    # a multi-GB packfile stream fails the whole fetch.
    #
    # meta-rockchip avoids this by pointing at JeffyCN's filtered mirror; we need
    # radxa's tree only for rk3566-radxa-zero-3w-*.dts, so fetch it shallow.
    #
    # Caveat: depth 1 only contains the branch tip, and our SRCREV *is* the tip
    # today. When radxa next pushes to linux-6.1-stan-rkr4.1 the pinned SRCREV
    # leaves the shallow window and this breaks. Bump the depth when it does. If
    # that becomes annoying, the durable fix is to go back to JeffyCN's small
    # mirror and carry the three Zero 3W device trees as patches in
    # meta-microduck/recipes-kernel/linux/patches/ instead.
    BB_GIT_SHALLOW:pn-linux-rockchip = "1"
    BB_GIT_SHALLOW_DEPTH:pn-linux-rockchip = "1"

    # Root login with no password lives in microduck-image-dev.bb, not here.
    #
    # It was EXTRA_IMAGE_FEATURES in this file, which applies to every image built
    # from this config, under a comment asking whoever ships an image to remember
    # to delete the line. Scoping it to a recipe whose name says what it is makes
    # `bitbake microduck-image` shippable by construction instead.
    #
    # wrynose removed the `debug-tweaks` catch-all; that recipe takes the pieces we
    # actually want. Deliberately NOT included, there or here: serial-autologin-root
    # (typing `root` is not the bottleneck), tools-debug, tools-sdk, dev-pkgs,
    # staticdev -- dev headers and debuggers belong in the SDK (`-c populate_sdk`),
    # not on the robot. reachy_mini_os ships build-essential and gdb on the device
    # because PyGObject compiles on-target; we have no reason to repeat that.

    # A robot has no display server. Dropping x11 also drops the XSERVER list
    # that rockchip-common.inc sets up.
    DISTRO_FEATURES:remove = "x11"

  display-server-mask: |
    # meta-rockchip repoints xserver-xorg and weston at JeffyCN forks with
    # SRCREV = "${AUTOREV}" and, for xserver, a ${PV}-derived branch name. Both
    # are problems:
    #
    #  - AUTOREV means a git ls-remote on every parse and a build that cannot be
    #    reproduced, which defeats the reason we pin every layer to a commit.
    #  - The xserver tag it derives, 21.1.22_2025_11_06, does not exist: the fork
    #    stops at 21.1.21 while oe-core wrynose ships xserver-xorg 21.1.22. That
    #    is a hard parse failure for the whole tree, not just for X.
    #
    # We need neither a display server: M5's GStreamer path is kmssrc, which
    # wants libdrm, not X or Weston. Mask both bbappends.
    #
    # Revisit if a display is ever added -- masking the bbappend means losing
    # meta-rockchip's Rockchip-specific patches along with the breakage.
    BBMASK += "meta-rockchip/recipes-graphics/(xorg-xserver|wayland/weston)"

  init: |
    INIT_MANAGER = "systemd"

    # NetworkManager owns the network, and only NetworkManager.
    #
    # docs/architecture.md:190 in microduck_daemon fixes this choice: "Wifi
    # credentials | NetworkManager | We never store them; clients drive NM via its
    # DBus API." wpa-supplicant stays -- NM has no supplicant of its own and drives
    # wpa_supplicant over D-Bus, so dropping it would break wifi entirely.
    #
    # What has to go is systemd's own stack. INIT_MANAGER = "systemd" otherwise
    # installs *and enables* systemd-networkd and systemd-resolved next to NM:
    # two daemons managing the same interfaces, and two competing wait-online
    # units both gating network-online.target -- which updaterd.service depends
    # on, so a networkd wait-online that never settles stalls the updater on a
    # board whose wifi is fine.
    # nss-resolve has to go with resolved: oe-core enables it by default and
    # systemd's meson refuses the combination --
    #   "nss-resolve is requested but resolve is disabled"
    # Nothing in systemd's PACKAGECONFIG depends on networkd. Without nss-resolve
    # glibc just uses /etc/resolv.conf, which NetworkManager writes itself.
    VIRTUAL-RUNTIME_net_manager = "networkmanager"
    PACKAGECONFIG:remove:pn-systemd = "networkd resolved nss-resolve"

  services: |
    # Three services poky enables by default that a robot should not be running.
    # Found by importing the rootfs into an arm64 container and listing
    # /etc/systemd/system/multi-user.target.wants -- the build is perfectly happy
    # with all of them.

    # rpcbind, listening on :111. Pulled in by DISTRO_FEATURES "nfs" (a poky
    # default) via packagegroup-base-nfs. This is not an NFS client.
    DISTRO_FEATURES:remove = "nfs"

    # busybox-syslog, a second logger next to journald. default-providers.inc sets
    # VIRTUAL-RUNTIME_base-utils-syslog ?= "busybox-syslog". microduck_daemon
    # ships a journald drop-in with Storage=persistent and ForwardToSyslog=no, so
    # journald is the log store and syslog is dead weight.
    VIRTUAL-RUNTIME_base-utils-syslog = ""

    # dnsmasq.service, a general-purpose DNS/DHCP server. The *binary* is wanted:
    # NetworkManager needs it for shared/hotspot connections, which is how wifi
    # provisioning will work (Reachy Mini's equivalent drives `nmcli Hotspot`).
    # But NM spawns its own instance, so the standalone service should not be
    # listening. Keep the package, disable the unit.
    SYSTEMD_AUTO_ENABLE:pn-dnsmasq = "disable"
