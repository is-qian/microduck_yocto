# microduck OS -- portable build definition.
#
# Deliberately contains NO absolute paths, so it is identical on every build
# host. Per-host paths live in kas/host-*.yml and are composed on the command
# line:
#
#   kas-container build kas/microduck.yml:kas/host-coach.yml
#
# Note there is no `poky` repo here. The combined poky repo has no wrynose
# branch (it stops at walnascar), so we use the three repos meta-rockchip's
# README actually names: openembedded-core, meta-yocto and meta-openembedded.
# bitbake is a fourth, checked out as a sibling of openembedded-core, which is
# where oe-buildenv-internal's `$OEROOT/../bitbake` fallback finds it.

header:
  version: 14

distro: microduck
machine: microduck-zero3

# The dev image, while we are still bringing the board up: every image built so
# far has gone onto a board that is then reached over ssh, and microduck-image has
# no login at all now that the password-less root feature moved into
# microduck-image-dev.bb. Build the shippable one explicitly:
#
#     HFJOB_TARGET=microduck-image scripts/build-hfjob.sh
#
# Flip this default when there is a product to ship rather than a board to debug.
# sstate makes the other image cheap either way -- only do_rootfs and the image
# tasks differ, every package is shared.
target: microduck-image-dev

# The daemon release (README.md, "Which daemon the image seeds"). null: forwarded
# to bitbake when set, nothing otherwise.
env:
  MICRODUCK_DAEMON_VERSION: null
  MICRODUCK_DAEMON_SRCREV: null

repos:
  # This repo; no url/commit, kas uses the checkout. Three layers, split the way
  # yocto-check-layer requires (one layer cannot be both DISTRO and BSP):
  # -bsp the boards, -distro the policy, meta-microduck the robot's software.
  microduck_os:
    layers:
      meta-microduck-bsp:
      meta-microduck-distro:
      meta-microduck:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    layers:
      # Not a layer -- oe-core requires bitbake >= 2.18.0 and locates it by path.
      .: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804
    layers:
      meta-poky:
      meta-yocto-bsp: disabled

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    commit: f28a144aa0a0ae05ca2ee91e1aef6aa05f6a12db
    layers:
      meta-oe:            # meta-rockchip depends on this (openembedded-layer)
      meta-python:
      meta-multimedia:
      meta-networking:    # NetworkManager

  meta-rockchip:
    url: https://github.com/JeffyCN/meta-rockchip.git
    branch: wrynose
    commit: 54f31b3987948afc07d2e83cb0ecd981d7476de3

  # A/B OS updates. LAYERDEPENDS is "core" alone, already satisfied, and the
  # layer root is the layer (no `layers:` key needed).
  #
  # Note this is rauc/meta-rauc, which is a different thing from the RAUC demo
  # that lives in the *Yocto Project's* meta-rockchip under
  # dynamic-layers/rk-rauc-demo/. That demo targets this exact board and is the
  # design we copied, but we cannot use the layer itself -- it is JeffyCN's
  # meta-rockchip we need, for the vendor kernel the camera and AIC8800 depend on.
  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: wrynose
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d

local_conf_header:
  # Build-host only; rootfs policy is in meta-microduck-distro/conf/distro/microduck.conf.
  microduck: |
    # Vendor BSP kernel + rkaiq + full GStreamer is comfortably 100 GB+ of
    # TMPDIR without this.
    INHERIT += "rm_work"

  kernel-shallow: |
    # radxa/kernel is a full Linux history: 13,224,308 objects and 10.7M deltas.
    # A --mirror clone of it died with "fatal: fetch-pack: invalid index-pack
    # output" and is a liability regardless -- a single corrupt byte anywhere in
    # a multi-GB packfile stream fails the whole fetch.
    #
    # meta-rockchip avoids this by pointing at JeffyCN's filtered mirror; we need
    # radxa's tree only for rk3566-radxa-zero-3w-*.dts, so fetch it shallow.
    #
    # Caveat: depth 1 only contains the branch tip, and our SRCREV *is* the tip
    # today. When radxa next pushes to linux-6.1-stan-rkr4.1 the pinned SRCREV
    # leaves the shallow window and this breaks. Bump the depth when it does. If
    # that becomes annoying, the durable fix is to go back to JeffyCN's small
    # mirror and carry the three Zero 3W device trees as patches in
    # meta-microduck-bsp/recipes-kernel/linux/files/ instead.
    BB_GIT_SHALLOW:pn-linux-rockchip = "1"
    BB_GIT_SHALLOW_DEPTH:pn-linux-rockchip = "1"
