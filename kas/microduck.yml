# microduck OS -- portable build definition.
#
# Deliberately contains NO absolute paths, so it is identical on every build
# host. Per-host paths live in kas/host-*.yml and are composed on the command
# line:
#
#   kas-container build kas/microduck.yml:kas/host-coach.yml
#
# Note there is no `poky` repo here. The combined poky repo has no wrynose
# branch (it stops at walnascar), so we use the three repos meta-rockchip's
# README actually names: openembedded-core, meta-yocto and meta-openembedded.
# bitbake is a fourth, checked out as a sibling of openembedded-core, which is
# where oe-buildenv-internal's `$OEROOT/../bitbake` fallback finds it.

header:
  version: 14

distro: poky
machine: microduck-zero3
target: microduck-image

repos:
  # This repo. Contributes meta-microduck; no url/commit, kas uses the checkout.
  microduck_os:
    layers:
      meta-microduck:

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    commit: f09a0f28aeb54ddd90415dd458338e1565bb5a49
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers:
      # Not a layer -- oe-core requires bitbake >= 2.18.0 and locates it by path.
      .: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c
    layers:
      meta-poky:
      meta-yocto-bsp: disabled

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    commit: af8b6d6b2f0b11595b0a0d5b82efa3129d52a628
    layers:
      meta-oe:            # meta-rockchip depends on this (openembedded-layer)
      meta-python:
      meta-multimedia:
      meta-networking:    # NetworkManager

  meta-rockchip:
    url: https://github.com/JeffyCN/meta-rockchip.git
    branch: wrynose
    commit: 54f31b3987948afc07d2e83cb0ecd981d7476de3

local_conf_header:
  microduck: |
    # rockchip-libmali is a redistributable binary blob.
    LICENSE_FLAGS_ACCEPTED = "commercial"

    # Vendor BSP kernel + rkaiq + full GStreamer is comfortably 100 GB+ of
    # TMPDIR without this.
    INHERIT += "rm_work"

  kernel-shallow: |
    # radxa/kernel is a full Linux history: 13,224,308 objects and 10.7M deltas.
    # A --mirror clone of it died with "fatal: fetch-pack: invalid index-pack
    # output" and is a liability regardless -- a single corrupt byte anywhere in
    # a multi-GB packfile stream fails the whole fetch.
    #
    # meta-rockchip avoids this by pointing at JeffyCN's filtered mirror; we need
    # radxa's tree only for rk3566-radxa-zero-3w-*.dts, so fetch it shallow.
    #
    # Caveat: depth 1 only contains the branch tip, and our SRCREV *is* the tip
    # today. When radxa next pushes to linux-6.1-stan-rkr4.1 the pinned SRCREV
    # leaves the shallow window and this breaks. Bump the depth when it does. If
    # that becomes annoying, the durable fix is to go back to JeffyCN's small
    # mirror and carry the three Zero 3W device trees as patches in
    # meta-microduck/recipes-kernel/linux/patches/ instead.
    BB_GIT_SHALLOW:pn-linux-rockchip = "1"
    BB_GIT_SHALLOW_DEPTH:pn-linux-rockchip = "1"

    # Bring-up convenience: root login with no password, on serial and over ssh.
    #
    # wrynose removed the `debug-tweaks` catch-all; these are the pieces of it we
    # actually want. Deliberately NOT included: serial-autologin-root (typing
    # `root` is not the bottleneck), tools-debug, tools-sdk, dev-pkgs, staticdev
    # -- dev headers and debuggers belong in the SDK (`-c populate_sdk`), not on
    # the robot. reachy_mini_os ships build-essential and gdb on the device
    # because PyGObject compiles on-target; we have no reason to repeat that.
    #
    # MUST NOT SHIP. Strip this line before any image leaves a desk.
    EXTRA_IMAGE_FEATURES = "allow-empty-password allow-root-login empty-root-password"

    # A robot has no display server. Dropping x11 also drops the XSERVER list
    # that rockchip-common.inc sets up.
    DISTRO_FEATURES:remove = "x11"

  display-server-mask: |
    # meta-rockchip repoints xserver-xorg and weston at JeffyCN forks with
    # SRCREV = "${AUTOREV}" and, for xserver, a ${PV}-derived branch name. Both
    # are problems:
    #
    #  - AUTOREV means a git ls-remote on every parse and a build that cannot be
    #    reproduced, which defeats the reason we pin every layer to a commit.
    #  - The xserver tag it derives, 21.1.22_2025_11_06, does not exist: the fork
    #    stops at 21.1.21 while oe-core wrynose ships xserver-xorg 21.1.22. That
    #    is a hard parse failure for the whole tree, not just for X.
    #
    # We need neither a display server: M5's GStreamer path is kmssrc, which
    # wants libdrm, not X or Weston. Mask both bbappends.
    #
    # Revisit if a display is ever added -- masking the bbappend means losing
    # meta-rockchip's Rockchip-specific patches along with the breakage.
    BBMASK += "meta-rockchip/recipes-graphics/(xorg-xserver|wayland/weston)"

  init: |
    INIT_MANAGER = "systemd"
