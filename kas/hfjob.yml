# microduck OS -- Hugging Face Jobs overlay.
#
#   kas build kas/microduck.yml:kas/hfjob.yml
#
# Composed on top of microduck.yml for job builds only. Paths live in
# kas/hfjob.env; this file is for bitbake settings that a throwaway container
# needs and a persistent build host does not.
header:
  version: 14
local_conf_header:
  buildhistory: |
    # Per-image package sizes, published by build-hfjob.sh's save(). Image only:
    # no per-recipe history, no SDK. Hooks are vardepsexclude; only the image
    # recipe's last 7 tasks rehash (IMAGE_CLASSES gains image-artifact-names).
    # COMMIT: the default "1" git-commits every build.
    INHERIT += "buildhistory"
    BUILDHISTORY_FEATURES = "image"
    BUILDHISTORY_COMMIT = "0"
  hashserv-db: |
    # Without this, sstate reuse between jobs is 0%.
    #
    # oe-core enables hash equivalence, and sstate objects are *named* by unihash,
    # not by taskhash:
    #
    #   sstate/31/5e/sstate:acl-native::2.3.2:r0::14:315e07da79b3..._populate_lic.tar.zst
    #
    # The unihash mapping lives in a sqlite DB that defaults to somewhere under
    # TOPDIR -- which on a job is the ephemeral disk, gone when the container
    # exits. Every run therefore started with an empty database, minted brand new
    # unihashes, looked for objects under names nothing had ever written, and
    # rebuilt the world:
    #
    #   Sstate summary: Wanted 675 Local 0 Mirrors 0 Missed 675 (0% match)
    #
    # ...while writing a fresh set of objects each time, so the bucket grew
    # (1342 -> 1439 tarballs) and never once got used. bitbake says this itself in
    # the build log and names this exact variable as the fix.
    #
    # coach needs none of this: its build directory persists between builds, so
    # the database survives. That is why it lives here and not in microduck.yml.
    BB_HASHSERVE_DB_DIR = "${SSTATE_DIR}"
  bucket-mirrors: |
    # Read downloads/ in the bucket (mounted at /cache) as a mirror, not copied in
    # first: it is 128 GB, and a build reusing 99% of its tasks fetches almost
    # nothing. sstate travels as one archive instead; scripts/build-hfjob.sh has
    # the numbers, and why SSTATE_MIRRORS through the mount was tried and dropped.
    #
    # - git: MIRRORNAME expands to host.path with / turned into dots, which is
    #   exactly how DL_DIR/git2/ names its bare clones
    #   (bitbake lib/bb/fetch2/__init__.py, at the pinned commit).
    # - Everything else is checksummed, so the mirror path becomes the file's name
    #   in DL_DIR. That covers the 1700 .crate files, which sit flat in downloads/.
    #
    # PREMIRRORS, not MIRRORS, so the bucket is tried before upstream. Upstream
    # is still tried if the bucket lacks something. Mirror settings do not enter
    # task signatures: with them set, job 6ac3abad still matched 98% of sstate.
    #
    # Not yet exercised: a git clone of a large repo (the kernel's is 10 GB)
    # through this mirror. A fetch writing *into* the mount once stalled for an
    # hour (kas/hfjob.env). This only reads, which is what the old bulk copy did
    # too, but if a kernel rebuild ever hangs in do_fetch, look here first.
    PREMIRRORS:prepend = "\
        git://.*/.* git:///cache/downloads/git2/MIRRORNAME;protocol=file \
        gitsm://.*/.* gitsm:///cache/downloads/git2/MIRRORNAME;protocol=file \
        ftp://.*/.* file:///cache/downloads/ \
        http://.*/.* file:///cache/downloads/ \
        https://.*/.* file:///cache/downloads/ \
        crate://.*/.* file:///cache/downloads/ \
    "
