# Path overlay for the `lotus` laptop.
#
# /home has ~28 GB free, which will not fit a rockchip build, so everything
# lives on /mnt/data.
#
#   kas-container build kas/microduck.yml:kas/host-lotus.yml

header:
  version: 14

local_conf_header:
  host-paths: |
    DL_DIR = "/mnt/data/fabien/yocto/downloads"
    SSTATE_DIR = "/mnt/data/fabien/yocto/sstate"
    TMPDIR = "/mnt/data/fabien/yocto/tmp"

    # Reuse coach's build output instead of repeating a multi-hour build.
    # sstate is content-addressed, so keeping this warm is a plain file copy:
    #   rsync -a coach:/data1/fabien/yocto/sstate/ /mnt/data/fabien/yocto/sstate-coach/
    SSTATE_MIRRORS ?= "file://.* file:///mnt/data/fabien/yocto/sstate-coach/PATH;downloadfilename=PATH"
