# TEMPORARY -- delete once coach's DRAM is set to 4800 MT/s (or the DIMM replaced).
#
# coach has a memory fault. `memtest=4` reserves the first bad region at 30.5 GiB,
# which moved the failure threshold from ~36 GB to ~50 GB but did not remove it:
# stressapptest is clean at 45 GB and finds 1582 incidents at 55 GB. Full detail and
# the retest commands are in ../../CONTEXT.md (the microduck_os folder).
#
# Usage -- the cgroup cap is the part that matters, this file only makes the build
# fit inside it:
#
#   . kas/coach.env
#   kas-container --ssh-agent \
#       --runtime-args "--memory=28g --memory-swap=28g" \
#       build kas/microduck.yml:kas/limited-ram.yml
#
# cgroup v2 charges page cache to the cgroup, so 28 GB bounds cache growth as well
# as the compilers' anonymous memory, keeping total system usage far below the
# failing range.
#
# Honest limitation: a cgroup bounds *how much* memory is used, not *which*
# physical pages the kernel hands out. The fault is capacity-correlated, so staying
# low keeps the allocator away from the bad regions in practice — but it is not a
# guarantee. An image built this way is for proving the metadata. Rebuild on healthy
# memory before flashing.
#
# Why parallelism is capped: to fit the cgroup, not to avoid corruption (the fault
# is capacity-dependent, not load-dependent). llvm-native — pulled in because
# oe-core's Rust needs LLVM — is the worst offender. At PARALLEL_MAKE=-j24 that is
# 24 concurrent g++ at 1-2 GB each, and it is what first reached the *unreserved*
# bad memory, surfacing as:
#
#   /usr/include/c++/14/bits/unique_ptr.h:312:11: internal compiler error: Segmentation fault
#
# so it gets a tighter limit than everything else.

header:
  version: 14

local_conf_header:
  limited-ram: |
    BB_NUMBER_THREADS = "12"
    PARALLEL_MAKE = "-j12"
    PARALLEL_MAKE:pn-llvm-native = "-j6"
