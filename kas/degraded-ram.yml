# TEMPORARY -- delete once coach's RAM is fixed.
#
# coach has a defective physical memory region that only gets allocated above
# roughly 34-38 GB of usage (bit 22 of each 32-bit half; see ../../CONTEXT.md in
# the microduck_os folder). Keeping total usage under that threshold avoids it.
#
#   . kas/coach.env
#   kas-container --runtime-args "--memory=26g --memory-swap=26g" \
#       build kas/microduck.yml:kas/degraded-ram.yml
#
# The container memory cap is the part that matters: cgroup v2 charges page cache
# to the cgroup, so the cache growth that would otherwise creep into the bad
# region over a long build is bounded along with the compilers' anonymous memory.
#
# The parallelism reduction below is NOT a corruption mitigation. The fault is
# capacity-dependent, not load-dependent -- 20 threads over 9 GB were spotless
# while 2 threads over 46 GB produced 176 errors. It is here for one mundane
# reason: 24 concurrent compilers would exceed a 26 GB cap and get OOM-killed.
#
# A build produced under this file is for proving the metadata works. It is NOT
# trustworthy output -- a cgroup bounds how much memory is used, not which
# physical pages the kernel hands out. Do not flash it.

header:
  version: 14

local_conf_header:
  degraded-ram: |
    BB_NUMBER_THREADS = "8"
    PARALLEL_MAKE = "-j8"
