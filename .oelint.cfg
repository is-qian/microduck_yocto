# oelint-adv, run from the repo root: see AGENTS.md "Commits" for the command.
# Only the rules in .oelint-rules.json run. The defaults are oelint-adv's house
# style (variable order, tabs, docstrings); these enforce wrynose idioms
# (${UNPACKDIR}, *_OPTED_OUT, renamed variables), reproducible fetches (no
# AUTOREV, checksums, Upstream-Status), no debug or password-less features in
# the shipping image, or catch a real mistake.
[oelint]
release = wrynose
# The default (fast) mode silently skips .conf files: distro and machine confs.
mode = all
rulefile = .oelint-rules.json
# vars.mispell stays: it flags a name one edit away from a known variable.
# .unknown flags every variable it has never heard of, ours (MICRODUCK_*) included.
suppress = oelint.vars.mispell.unknown
nobackup = True
relpaths = True
quiet = True
