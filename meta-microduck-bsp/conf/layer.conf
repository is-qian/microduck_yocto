BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "microduck-bsp"
BBFILE_PATTERN_microduck-bsp := "^${LAYERDIR}/"

# Above meta-rockchip (9) so our bbappends and machine configs win.
BBFILE_PRIORITY_microduck-bsp = "20"

LAYERVERSION_microduck-bsp = "1"
# The boards: machine confs, kernel, U-Boot, radios, board support, partition
# layout (files/wic). networking-layer: microduck-usb-gadget runs dnsmasq.
LAYERDEPENDS_microduck-bsp = "core openembedded-layer networking-layer rockchip"
LAYERSERIES_COMPAT_microduck-bsp = "wrynose"
