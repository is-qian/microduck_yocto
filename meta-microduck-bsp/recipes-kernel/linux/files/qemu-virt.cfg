# Let the shipping kernel boot under `qemu-system-aarch64 -M virt`.
#
# Verified absent from radxa's rockchip_linux_defconfig, which is why an
# unmodified build gives a silent hang under QEMU: no PCI host, so no disk and no
# network, and -- the reason nothing at all appears -- no PL011 driver, which is
# the UART QEMU's virt machine provides.
#
# The point is being able to boot *the exact kernel and rootfs that ship* on a
# developer laptop, rather than a separate qemuarm64 MACHINE with a different
# kernel and a different tune (which would also share almost no sstate with
# cortexa55 and mean a full second build).
#
# Cost is ~100 KB of drivers the robot never uses. That buys testing systemd unit
# ordering, NetworkManager startup, robotd/updaterd sockets and the
# network-online.target behaviour without hardware -- all things Docker cannot
# see, because a container shares the host kernel.
#
# Not testable this way regardless: U-Boot, the Rockchip DTB, the AIC8800 over
# SDIO, /dev/ttyS2 and the Dynamixel loop.

CONFIG_PCI_HOST_GENERIC=y

CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y

# QEMU virt's serial port and RTC.
CONFIG_ARM_AMBA=y
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_RTC_DRV_PL031=y
