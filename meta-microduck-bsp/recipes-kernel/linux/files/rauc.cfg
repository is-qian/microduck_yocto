# What RAUC needs to install a verity bundle: a squashfs image mounted through a
# loop device with a dm-verity mapping over it. meta-rauc carries this fragment
# for linux-yocto only. Radxa's defconfig has most of it already and DM/DM_VERITY
# as modules; built in, a missing module cannot fail an install half way, and a
# later SRCREV that drops one fails the kernel config instead of a robot.
CONFIG_BLK_DEV_LOOP=y
CONFIG_MISC_FILESYSTEMS=y
CONFIG_SQUASHFS=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y
