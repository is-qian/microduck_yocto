# ALSA's "default" on the beta board: play on the RK809 codec, record from the face
# board's PDM microphone. Two cards, so an asym PCM ties them under one name.
#
# The daemon plays on `[audio] device` (plughw:aic3104 by default, the Zero 3W's HAT
# codec) and falls back to "default" when that card is absent, which on this board
# it always is. Card ids are ALSA's: the DT card name with everything that is not a
# letter or digit removed ("rockchip-rk809" -> rockchiprk809, "face-mic" -> facemic).
pcm.!default {
	type asym
	playback.pcm "plughw:rockchiprk809"
	capture.pcm "plughw:facemic"
}

ctl.!default {
	type hw
	card rockchiprk809
}
