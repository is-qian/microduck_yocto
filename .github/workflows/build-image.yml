name: build-image

# Builds the microduck image on Hugging Face Jobs and reports the result.
#
# GitHub runs the orchestration, not the build. That is not a preference, it is
# arithmetic: a hosted runner has 4 cores, 16 GB RAM and ~14 GB of free disk,
# while this build wants 32 cores and its sstate cache alone is 48 GB. The
# Actions cache tops out at 10 GB per repository, so the one thing that must
# persist between builds cannot live there. On HF Jobs the same build takes ~6
# minutes of bitbake at 99% sstate reuse and costs about $1.60.
#
# By default it builds microduck-bundle: the dev-signed RAUC bundle, plus, since
# the bundle depends on the image's do_image_complete, the dev image's .wic. So
# every merge yields both a card to flash and an update to `rauc install`.
#
# HF_TOKEN launches the job AND reaches the bucket, because the bucket is mounted
# into the job by the platform as the org. RAUC_DEV_KEY / RAUC_DEV_CERT (the PEM
# files from README.md "Signing keys are not in this repo") are the one credential
# that does enter the build: the bundle is signed inside the job. That is fine for
# the DEV key, which robots in the field must never trust. A production key must
# not take this path: sign releases with `rauc resign` in a separate job instead.
#
# Artifacts stay in the bucket. A .wic is ~900 MB, which is awkward as a release
# asset and pointless to move when the bucket is already private and already
# where the build wrote it. This publishes the hf:// URL instead.

on:
  workflow_dispatch:
    inputs:
      kas_command:
        description: "kas command (build, or checkout to validate the pipeline cheaply)"
        type: choice
        options: [build, checkout]
        default: build
      target:
        description: "recipe to build, e.g. linux-rockchip (empty = microduck-bundle: dev image .wic + signed bundle)"
        type: string
        default: ""
      machine:
        description: "board: the Zero 3W stand-in, or the beta board"
        type: choice
        options: [microduck-zero3, microduck-beta]
        default: microduck-zero3
      flavor:
        description: "HF Jobs hardware flavor"
        type: choice
        options: [cpu-performance, cpu-basic]
        default: cpu-performance
  push:
    branches: [main]
    # Only what can change the image. A README edit should not spend $1.60.
    paths:
      - "meta-microduck/**"
      - "kas/**"
      - "scripts/build-hfjob.sh"
      - ".github/workflows/build-image.yml"

# Queue rather than cancel. Cancelling mid-build would leave the HF job running
# and billing, and the cleanup step below only fires for jobs this run started.
#
# One queue per branch: main's builds still run in order, but a branch no longer
# waits for main or for another branch (each did, for about an hour, on
# 2026-10-05). Running side by side is safe for two reasons:
# - each job uploads its inputs to a folder of its own (build-hfjob.sh)
# - the shared cache is only written atomically, under content-addressed names
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The build is ~50 min warm and hours cold; this is a backstop, not a target.
    timeout-minutes: 240

    # `shell: bash` runs every step as `bash --noprofile --norc -eo pipefail`,
    # and the pipefail is the point. GitHub's default is `bash -e`, under which a
    # failing command in a pipeline is invisible: `scripts/wait-hfjob.sh | tee`
    # takes its exit status from tee, so the step goes green no matter what the
    # script decided. That is exactly how run 34837726446 reported success while
    # wait-hfjob.sh had failed to execute at all -- the same false-green this
    # workflow exists to prevent, reintroduced one level up.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # >= 1.30 for bucket volume mounts in `hf jobs run`.
      - name: Install the Hugging Face CLI
        run: pip install --quiet "huggingface_hub[cli]>=1.30"

      - name: Launch the build on HF Jobs
        id: launch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HFJOB_TARGET: ${{ inputs.target || 'microduck-bundle' }}
          # A push builds the Zero 3W only; the beta board is built on demand
          # until it is the board people flash, so a push does not cost two builds.
          HFJOB_MACHINE: ${{ inputs.machine || 'microduck-zero3' }}
          HFJOB_FLAVOR: ${{ inputs.flavor || 'cpu-performance' }}
          RAUC_DEV_KEY: ${{ secrets.RAUC_DEV_KEY }}
          RAUC_DEV_CERT: ${{ secrets.RAUC_DEV_CERT }}
        run: |
          set -eu
          # build-hfjob.sh reads the pair from files, and only sends it to a
          # bundle job. If a secret is missing the file is empty and the script
          # refuses before launching, instead of failing in do_bundle 45 min in.
          umask 077
          # sed '$a\' restores a final newline a pasted PEM may have lost, and
          # leaves an empty secret empty.
          printf '%s' "$RAUC_DEV_KEY" | sed '$a\' > "$RUNNER_TEMP/rauc.key.pem"
          printf '%s' "$RAUC_DEV_CERT" | sed '$a\' > "$RUNNER_TEMP/rauc.cert.pem"
          export HFJOB_RAUC_KEY="$RUNNER_TEMP/rauc.key.pem" HFJOB_RAUC_CERT="$RUNNER_TEMP/rauc.cert.pem"
          out=$(scripts/build-hfjob.sh "${{ inputs.kas_command || 'build' }}" 2>&1 | tee /dev/stderr)
          # Parse the id out of the job URL, not out of `id=...`. The CLI prints
          # two different shapes depending on where it runs -- `id=<hex> name=...`
          # in one place and an indented, ANSI-coloured `  id: <hex>` in another --
          # and the first run of this workflow died on exactly that. The URL line
          # carries the id in both, so match that and strip colour first.
          id=$(printf '%s\n' "$out" \
                | sed -e 's/\x1b\[[0-9;]*m//g' \
                | grep -oE 'jobs/[^/[:space:]]+/[A-Za-z0-9]{16,}' \
                | head -1 | sed 's|.*/||')
          test -n "$id" || { echo "could not parse a job id from build-hfjob.sh"; exit 1; }
          echo "parsed job id: $id"
          echo "job_id=$id" >> "$GITHUB_OUTPUT"
          echo "Launched https://huggingface.co/jobs/pollen-robotics/$id" >> "$GITHUB_STEP_SUMMARY"

      # Judges the build on its logs, never on its exit status -- see the long
      # explanation at the top of wait-hfjob.sh. Every green build of this image
      # so far has reported ERROR, so `hf jobs wait` would fail all of them.
      - name: Wait for it, and decide whether it actually worked
        id: wait
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          scripts/wait-hfjob.sh "${{ steps.launch.outputs.job_id }}" | tee /tmp/verdict.txt
          grep -oE '^artifacts=.*' /tmp/verdict.txt >> "$GITHUB_OUTPUT" || true

      - name: Publish what was built
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eu
          prefix="${{ steps.wait.outputs.artifacts }}"
          # Guard, because an empty prefix means the wait step did not produce a
          # verdict and we would otherwise "publish" nothing while staying green.
          test -n "$prefix" || { echo "no artifacts prefix from the wait step"; exit 1; }
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          hf buckets ls "$prefix/" | grep -E "rootfs-[0-9]+\.wic|bundle-.*-[0-9]+\.raucb|zboot\.img--|\.manifest$" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts: \`$prefix\`" >> "$GITHUB_STEP_SUMMARY"

      # A run that ends without reaching a terminal job state leaves the job
      # running and billing by the minute. Failure counts, not just cancellation:
      # the first run of this workflow died parsing the job id *after* launching
      # a job, which orphaned it. Cancelling an already-terminal job is a no-op,
      # so this is safe to fire on both. Targeted at the one id this run started
      # -- the org's job namespace is shared, and a broader sweep would kill
      # someone else's training run.
      #
      # --namespace is load-bearing and was missing at first: `hf jobs cancel`
      # looks the job up under the *token owner's* namespace by default, so it
      # returned 404 "Job Not Found for url: .../jobs/FabienDanieau/<id>" while
      # the job ran on happily under pollen-robotics. The `|| true` then hid that,
      # and the step reported success having cancelled nothing.
      #
      # The failure is still non-fatal -- this runs on an already-failing path and
      # masking the original error would be worse -- but it is now loud, because
      # a silent failure here costs $1.90/h until somebody notices.
      - name: Cancel the HF job if this run did not finish cleanly
        if: (failure() || cancelled()) && steps.launch.outputs.job_id != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          id="${{ steps.launch.outputs.job_id }}"
          if hf jobs cancel "$id" --namespace pollen-robotics; then
            echo "cancelled $id"
          else
            echo "::warning::could not cancel HF job $id - it may still be running and billing."
            echo "::warning::check: hf jobs ps --namespace pollen-robotics"
          fi
