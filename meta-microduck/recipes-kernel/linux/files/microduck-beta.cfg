# Kernel options the beta board's device tree needs that radxa's
# rockchip_linux_defconfig leaves off. Beta machine only; every line is checked
# against the merged .config after do_configure (linux-rockchip_6.1.bbappend),
# because a symbol whose dependency is missing is dropped without a word.

# The face board's PCA9535 expander, and its interrupt (the face LEDs hang off it).
CONFIG_GPIO_PCA953X=y
CONFIG_GPIO_PCA953X_IRQ=y

# The face board's PDM microphone: the dmic-codec behind the "face-mic" card.
CONFIG_SND_SOC_DMIC=y

# A network function for the USB-C gadget (microduck-usb-gadget). The defconfig
# has configfs with ACM, mass storage, FunctionFS and UVC, but no Ethernet.
CONFIG_USB_CONFIGFS_NCM=y
