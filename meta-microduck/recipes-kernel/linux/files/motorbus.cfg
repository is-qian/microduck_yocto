# Hand UART2 to robotd's Dynamixel bus.
#
# The vendor BSP's FIQ debugger claims UART2 and exposes it as ttyFIQ0, which
# both holds the port and puts kernel printk on the same wires as 15 servos.
# With it off, UART2 enumerates as /dev/ttyS2 -- robotd.toml's default port.
#
# Only pulled in when MICRODUCK_MOTOR_UART = "1".
# CONFIG_FIQ_DEBUGGER is not set
# CONFIG_FIQ_DEBUGGER_CONSOLE is not set
