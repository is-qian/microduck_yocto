# What RAUC needs from the kernel to install a 'verity' bundle: the bundle is a
# squashfs image, mounted through a loop device with a dm-verity mapping over it.
#
# meta-rauc ships this fragment but only bbappends linux-yocto, so we carry it.
#
# Measured against radxa's rockchip_linux_defconfig at SRCREV 270a678f (which,
# per the WATCH OUT note in the bbappend, IS the effective config here -- the
# rk3568_linux.config meta-rockchip expects to cat onto it does not exist in
# radxa's tree). Of the seven symbols, five are already set:
#
#   CONFIG_BLK_DEV_LOOP=y      already =y
#   CONFIG_SQUASHFS=y          already =y
#   CONFIG_MISC_FILESYSTEMS=y  implied -- SQUASHFS depends on it
#   CONFIG_MD=y                already =y
#   CONFIG_CRYPTO_SHA256=y     satisfied by CONFIG_CRYPTO_SHA2_ARM64_CE=y
#   CONFIG_BLK_DEV_DM          defconfig has =m -- this promotes it to =y
#   CONFIG_DM_VERITY           defconfig has =m -- this promotes it to =y
#
# So this fragment changes two symbols and pins five. Both are worth having:
# promoting dm-verity to builtin removes a module-load failure mode in the
# middle of an install, and pinning means a future SRCREV bump that drops one
# of these fails the kernel config, not the first bundle install on a robot.
CONFIG_BLK_DEV_LOOP=y
CONFIG_MISC_FILESYSTEMS=y
CONFIG_SQUASHFS=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y
