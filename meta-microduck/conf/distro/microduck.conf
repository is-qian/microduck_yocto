# microduck OS -- what the robot runs.
#
# Poky plus our policy. This used to be local_conf_header in kas/microduck.yml,
# which made the image correct only when built through that one kas file: a plain
# `bitbake microduck-image` from oe-init-build-env, or any other kas composition,
# silently got systemd-networkd, rpcbind and X11 back. Here it travels with the
# layer. kas/microduck.yml keeps only how a build *host* behaves (rm_work, the
# kernel's shallow clone); anything that changes the rootfs belongs in this file.

require conf/distro/poky.conf

DISTRO = "microduck"
DISTRO_NAME = "microduck OS"

# Keep poky's override active, as poky-altcfg.conf does, so anything keyed
# `:poky` (meta-poky's psplash append, for one) behaves exactly as before.
# Note `microduck` is now a distro override name: a future MACHINEOVERRIDES
# family for the boards needs a different one.
DISTROOVERRIDES = "poky:microduck"

# Not overridden, deliberately: TARGET_VENDOR stays "-poky", so the toolchain
# triplet (aarch64-poky-linux), the SDK's environment-setup-aarch64-poky-linux
# and most of sstate are unchanged by the rename. DISTRO_VERSION stays poky's.

# rockchip-libmali is a redistributable binary blob.
LICENSE_FLAGS_ACCEPTED = "commercial"

# meta-rauc's sanity-meta-rauc.bbclass warns on every single parse without
# this. It is not only cosmetic: busybox and curl carry bbappends keyed off
# the feature (tar long options, and nghttp2 so adaptive updates can pipeline
# their range requests).
DISTRO_FEATURES:append = " rauc"

# What a headless robot does not need from oe-core's default feature set. Each
# of these is a knob some recipe we build reads, so each one is a build-time
# and often a rootfs cost:
#
#   x11, wayland  no display server. x11 also drops the XSERVER list that
#                 rockchip-common.inc sets up. wayland turns on waylandsink in
#                 gst-plugins-bad and `wayland egl` in gst-plugins-base.
#   opengl        no GL client. gst-plugins-base's PACKAGECONFIG_GL is gated on
#                 it, and its gstgl library is the only thing that pulled
#                 rockchip-libmali (the closed GPU blob) into the image: mali.inc
#                 makes libmali the provider of virtual/egl and virtual/libgles*.
#                 MPP (encode) and RGA (2D) do not use the GPU. Tested with
#                 opengl kept and wayland dropped (2026-10-06, Zero 3W): mediad
#                 streamed and mpph264enc encoded, while glupload could not even
#                 create an EGLDisplay -- GL was dead weight that did not work.
#   vulkan        gst-plugins-bad's vulkan plugin plus vulkan-loader and
#                 shaderc-native, for a robot with no Vulkan client.
#   pulseaudio    builds pulseaudio and gst-plugins-good's pulse plugin.
#                 sounds execs `aplay`; mediad links no pulse crate.
#   ptest         every recipe with a test suite also builds and packages it.
#                 Nothing installs them; it is pure build time.
#   3g, nfc       packagegroup-base installs ofono and neard on these alone
#                 (DISTRO_FEATURES, not COMBINED), so both were in the image.
#   debuginfod    a client in gdb/elfutils/binutils for a server we do not run.
#   nfs           rpcbind, listening on :111, via packagegroup-base-nfs. This
#                 is not an NFS client.
#
# Kept on purpose: zeroconf -- avahi-daemon and libnss-mdns, so
# `duck-xxxx.local` has a chance of resolving; microduck_daemon's
# install-dev.md already calls it unreliable here, and dropping it is a
# one-word change when it is decided.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan pulseaudio ptest 3g nfc debuginfod nfs"

# en-gb and the C locale package are the oe-core default; nothing on the robot
# reads a locale.
IMAGE_LINGUAS = "en-us"

# Root login with no password is not here either: it lives in
# microduck-image-dev.bb, scoped to an image whose name says it must not ship.
# That recipe also lists what is deliberately left out (debug-tweaks' other
# pieces, tools-sdk, dev-pkgs) and why.

# meta-rockchip repoints xserver-xorg and weston at JeffyCN forks with
# SRCREV = "${AUTOREV}" and, for xserver, a ${PV}-derived branch name. Both
# are problems:
#
#  - AUTOREV means a git ls-remote on every parse and a build that cannot be
#    reproduced, which defeats the reason we pin every layer to a commit.
#  - The xserver tag it derives, 21.1.22_2025_11_06, does not exist: the fork
#    stops at 21.1.21 while oe-core wrynose ships xserver-xorg 21.1.22. That
#    is a hard parse failure for the whole tree, not just for X.
#
# We need neither a display server: M5's GStreamer path is kmssrc, which
# wants libdrm, not X or Weston. Mask both bbappends.
#
# Revisit if a display is ever added -- masking the bbappend means losing
# meta-rockchip's Rockchip-specific patches along with the breakage.
BBMASK += "meta-rockchip/recipes-graphics/(xorg-xserver|wayland/weston)"

INIT_MANAGER = "systemd"

# NetworkManager owns the network, and only NetworkManager.
#
# docs/architecture.md:190 in microduck_daemon fixes this choice: "Wifi
# credentials | NetworkManager | We never store them; clients drive NM via its
# DBus API." wpa-supplicant stays -- NM has no supplicant of its own and drives
# wpa_supplicant over D-Bus, so dropping it would break wifi entirely.
#
# What has to go is systemd's own stack. INIT_MANAGER = "systemd" otherwise
# installs *and enables* systemd-networkd and systemd-resolved next to NM:
# two daemons managing the same interfaces, and two competing wait-online
# units both gating network-online.target -- which updaterd.service depends
# on, so a networkd wait-online that never settles stalls the updater on a
# board whose wifi is fine.
# nss-resolve has to go with resolved: oe-core enables it by default and
# systemd's meson refuses the combination --
#   "nss-resolve is requested but resolve is disabled"
# Nothing in systemd's PACKAGECONFIG depends on networkd. Without nss-resolve
# glibc just uses /etc/resolv.conf, which NetworkManager writes itself.
VIRTUAL-RUNTIME_net_manager = "networkmanager"
PACKAGECONFIG:remove:pn-systemd = "networkd resolved nss-resolve"

# Services poky enables by default that a robot should not be running. Found
# by importing the rootfs into an arm64 container and listing
# /etc/systemd/system/multi-user.target.wants -- the build is perfectly happy
# with all of them. scripts/qemu-test.sh guards against them coming back.
# rpcbind is the `nfs` feature above.

# busybox-syslog, a second logger next to journald. default-providers.inc sets
# VIRTUAL-RUNTIME_base-utils-syslog ?= "busybox-syslog". microduck_daemon
# ships a journald drop-in with Storage=persistent and ForwardToSyslog=no, so
# journald is the log store and syslog is dead weight. /var/log itself is
# oe-core's tmpfs symlink; the journal under it is bind-mounted from the data
# partition by recipes-core/microduck-data.
VIRTUAL-RUNTIME_base-utils-syslog = ""

# dnsmasq.service, a general-purpose DNS/DHCP server. The *binary* is wanted:
# NetworkManager needs it for shared/hotspot connections, which is how wifi
# provisioning will work (Reachy Mini's equivalent drives `nmcli Hotspot`).
# But NM spawns its own instance, so the standalone service should not be
# listening. Keep the package, disable the unit.
SYSTEMD_AUTO_ENABLE:pn-dnsmasq = "disable"
