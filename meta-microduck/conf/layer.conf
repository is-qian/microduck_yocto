BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "microduck"
BBFILE_PATTERN_microduck := "^${LAYERDIR}/"

# Above meta-rockchip (9) so our bbappends and machine configs win.
BBFILE_PRIORITY_microduck = "20"

LAYERVERSION_microduck = "1"
# yocto: conf/distro/microduck.conf requires meta-poky's poky.conf.
LAYERDEPENDS_microduck = "core openembedded-layer rockchip yocto"
LAYERSERIES_COMPAT_microduck = "wrynose"
