BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "microduck"
BBFILE_PATTERN_microduck := "^${LAYERDIR}/"

# Above meta-rockchip (9) so our bbappends win.
BBFILE_PRIORITY_microduck = "20"

LAYERVERSION_microduck = "1"
# The robot's software: images, the daemon, policies, update bundle, media.
# microduck-bsp: the images install MICRODUCK_RADIO_PACKAGES and microduck-board
# reads MICRODUCK_BOARD, both set by its machine confs. rauc: the bundle inherits
# meta-rauc's bundle class. networking-layer: NetworkManager.
LAYERDEPENDS_microduck = "core openembedded-layer networking-layer rauc rockchip microduck-bsp"
LAYERSERIES_COMPAT_microduck = "wrynose"
