#@TYPE: Machine
#@NAME: microduck beta (Seeed main board)
#@DESCRIPTION: RK3566, 1 GB DDR3, 64 GB eMMC. The custom microduck PCB, first spin.

# Same SoC as the Zero 3W, so the same meta-rockchip base: tune-cortexa55, vendor
# BSP 6.1 kernel, u-boot-rockchip, mali bifrost-g52, RK_ISP_VERSION=2.1.
require conf/machine/include/rk356x.inc
require conf/machine/include/microduck-common.inc

# The board is described by our own device tree, carried in this layer rather
# than in any kernel tree: recipes-kernel/linux/files/rk3566-microduck-beta.dts.
# MICRODUCK_BOARD_DTS makes linux-rockchip_6.1.bbappend copy it into the kernel
# source before compiling. It was transcribed from the V0.1 schematic, which is
# older than the boards in hand, and corrected against the DTB Seeed's own image
# boots (2026-10-05) -- docs/agents/beta-board.md says what came from where.
MICRODUCK_BOARD_DTS = "rk3566-microduck-beta.dts"
KERNEL_DEVICETREE = "rockchip/rk3566-microduck-beta.dtb"

# UART2 is NOT contested on this board: the motors are on UART3 and UART2 is the
# debug console on test pads TP83/TP84. So the FIQ debugger keeps UART2, the
# motor-bus kernel fragment and dts patch stay out, and a getty runs on ttyFIQ0.
# The motor UART still enumerates as /dev/ttyS2 -- the DTS swaps the serial
# aliases so robotd.toml needs no per-board value.
MICRODUCK_MOTOR_UART = "0"

# Same U-Boot as the Zero 3W, and for the same reason: it is the only one
# meta-rockchip tests. Two things differ on this board, neither verified yet:
#
#  - DRAM is DDR3, not LPDDR4. make.sh takes DRAM init from rkbin's rk3568 TPL,
#    which Rockchip documents as detecting DDR3/DDR4/LPDDR3/LPDDR4/LPDDR4X; the
#    first line of serial output (TP83/TP84, 1500000 8N1) says whether it did.
#  - It boots from eMMC, not SD. The boot ROM tries eMMC before SD and this
#    board has no SD slot, so there is nothing to choose between.
#
# CONFIG_DEBUG_UART_BASE=0xFE660000 (UART2), which on the Zero 3W prints onto
# the motor wires at power-on, is exactly right here: UART2 is the console.
UBOOT_MACHINE = "rk3568_defconfig"

# The same A/B layout as the Zero 3W. It addresses everything by GPT label and
# the first 16 MiB by raw offset, both of which mean the same thing on eMMC as on
# an SD card; it needs 12.1 GiB, and the eMMC is 64 GB.
WKS_FILE = "microduck-ab.wks.in"

# The radio is a WL6201S module, which Seeed's own image shows is a WuQi
# WQ9201S: SDIO IDs 0x0297/0x5348, driver wq_wlan (out of tree, DKMS
# wq9201s-wifi-bt-dkms 2.2.3.94 on their image), firmware wq9201_*.bin, and BT
# attached as H4 on UART1 by a wq9201s-bt-attach script. None of it is in any
# layer we use, so for now this image has NO working radio: a recipe for the
# driver, firmware and attach unit is the next piece of work, and it needs the
# driver source from Seeed or from their image. Deliberately empty rather than
# aic8800 -- that chip is not on this board.
#
# The images still pull aic8800-bt in by name (microduck-image.bb), whose
# attach unit will fail harmlessly here; it becomes per-machine with the WuQi
# recipe.
RK_WIFIBT_RRECOMMENDS = ""

# The fan: pwm-fan starts at full duty and only a thermal zone lowers it. The
# zone and its trips are in the DTS; this package switches it to step_wise.
MACHINE_EXTRA_RRECOMMENDS:append = " microduck-fan"
