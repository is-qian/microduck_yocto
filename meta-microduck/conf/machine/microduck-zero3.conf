#@TYPE: Machine
#@NAME: microduck on Radxa Zero 3W
#@DESCRIPTION: RK3566, Cortex-A55. Stand-in for the custom microduck PCB.

# Brings tune-cortexa55, rockchip-common.inc (vendor BSP 6.1 kernel,
# u-boot-rockchip), mali bifrost-g52, RK_SOC_FAMILY=rk3568, RK_ISP_VERSION=2.1.
require conf/machine/include/rk356x.inc
require conf/machine/include/microduck-common.inc

# This board has the AICSemi AIC8800DS2 (SDIO wifi/BT combo), not the Broadcom
# AP6212. Pinned to the single matching device tree on purpose: with more than one
# entry, linux-rockchip.inc derives a Rockchip boot.img target per DTB but only
# one boot.img gets deployed, so which variant it carries is ambiguous.
KERNEL_DEVICETREE = "rockchip/rk3566-radxa-zero-3w-aic8800ds2.dtb"

# Same as rockchip-rk3566-evb.conf: meta-rockchip's u-boot-rockchip is Rockchip
# downstream U-Boot 2017.09, built via `make.sh rk3568` with DRAM init coming
# from rkbin's TPL -- which is SoC-level, not board-level. That is the only
# combination meta-rockchip actually tests, so start there and change nothing.
#
# If it fails to reach the kernel, the targeted fix is radxa/u-boot
# next-dev-v2024.10, which despite its name is *also* U-Boot 2017.09 (it has
# make.sh) and carries rk3566-radxa-zero3.dts plus
# radxa-zero3-rk3566_defconfig. Swapping to it means keeping the second `rkbin`
# git entry in SRC_URI (make.sh needs it) and setting RK_UBOOT_CFG plus
# RK_UBOOT_SPL = "1", since radxa's defconfig is SPL+ATF rather than the
# Rockchip Miniloader this recipe defaults to.
UBOOT_MACHINE = "rk3568_defconfig"

# Two things found by reading radxa-zero3-rk3566_defconfig, both of which bite
# later rather than now:
#
# 1. RAUC (M7) needs a writable U-Boot environment and a boot counter for
#    rollback. Neither CONFIG_ENV_IS_IN_* nor CONFIG_BOOTCOUNT_LIMIT is set in
#    any of these Rockchip defconfigs. This U-Boot does have its own
#    Android/AVB A/B support (CONFIG_SPL_AB, CONFIG_AVB_LIBAVB_AB), which is a
#    *different* mechanism from the one RAUC's uboot backend drives. Decide
#    between adding the env/bootcount options and using RAUC's custom backend
#    before committing to a partition layout.
#
# 2. CONFIG_DEBUG_UART_BASE=0xFE660000 is RK3566 UART2 -- the motor bus -- at
#    1500000 baud. So U-Boot prints onto the Dynamixel wires at power-on even
#    when MICRODUCK_MOTOR_UART = "1", which only silences Linux. Harmless today
#    (robotd starts much later), but on the custom PCB put the debug UART
#    somewhere else.

# The AIC8800 is not in radxa's kernel tree and is not covered by meta-rockchip's
# rkwifibt-firmware (that recipe packages Broadcom AP6xxx and RTL8723DS only), so
# both driver and firmware come from our own recipe.
#
# Deliberately not pulling in rkwifibt-firmware or brcm-tools: those are Broadcom
# and this board has none.
RK_WIFIBT_RRECOMMENDS = "aic8800"
