# A writable U-Boot environment, which RAUC's uboot backend cannot work without.
# rk3568_defconfig sets no CONFIG_ENV_*, so it falls to ENV_IS_NOWHERE and saveenv
# silently does nothing. Why each value, with source references: docs/agents/rauc.md.

# Not ENVF, the Rockchip SDK's usual backend: it stores only a whitelist and
# refuses to persist bootargs (env/envf.c:23).
CONFIG_ENV_IS_IN_BLK_DEV=y

# A raw byte offset on the card -- env_blk.c never reads the GPT. 0x3F8000 is the
# vendor default and Rockchip's documented slot; set explicitly so the wks and
# fw_env.config can be checked against it (scripts/check-wks-layout.py).
CONFIG_ENV_OFFSET=0x3f8000
CONFIG_ENV_SIZE=0x8000

# No CONFIG_ENV_OFFSET_REDUND: on this backend the 2017.09 core never learns it is
# redundant (no BLK_DEV case in include/environment.h), so it would half-work.

# The boot script decrements the attempt counter with setexpr, which
# rk3568_defconfig explicitly disables.
CONFIG_CMD_SETEXPR=y
