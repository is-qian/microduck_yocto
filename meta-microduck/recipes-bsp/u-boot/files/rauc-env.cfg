# A writable U-Boot environment, which this board does not otherwise have.
#
# rk3568_defconfig sets no CONFIG_ENV_* at all, so the choice in env/Kconfig:26
# falls to its default, CONFIG_ENV_IS_NOWHERE. env/nowhere.c's location struct has
# no .save member, so `saveenv` is a no-op failure and env_nowhere_init() marks the
# env ENV_INVALID on every boot. Nothing persists. RAUC's uboot backend is built
# entirely on persisting BOOT_ORDER and BOOT_<slot>_LEFT, so it cannot work until
# this is on -- this fragment is the precondition for all of stage 2.
#
# Rockchip's downstream tree offers two backends and only one of them is usable:
#
#   ENVF (env/envf.c) is the SDK's usual choice and is the WRONG one here. It
#   stores only a whitelist, CONFIG_ENVF_LIST, defaulting to "blkdevparts mtdparts
#   sys_bootargs app reserved" -- every RAUC variable would have to be added to it.
#   Worse, env/envf.c:23 carries the literal refusal
#       #define EMSG_ARGS "error: please use \"sys_bootargs\" but not \"bootargs\""
#   so it will not persist bootargs at all.
#
#   ENV_IS_IN_BLK_DEV (env/env_blk.c) stores arbitrary variables. That is this one.
CONFIG_ENV_IS_IN_BLK_DEV=y

# Where the environment lives. env_blk.c does NOT look at the GPT: get_env_addr()
# takes CONFIG_ENV_OFFSET as a raw byte offset on whatever rockchip_get_bootdev()
# returns, and blk_dwrite()s there. A wrong value silently overwrites whatever
# occupies those bytes, with no partition boundary to stop it.
#
# 0x3F8000 = sector 8128, which is both the vendor default (env/Kconfig:516) and
# Rockchip's documented uboot_env slot. It is set explicitly anyway, so the value
# is visible here and asserted by the bbappend and by check-wks-layout.py, rather
# than inherited from a default someone might change.
#
# History worth keeping: the first version of this file used 0x80000, because the
# layout then followed JeffyCN's generic wks, which puts uboot at 2 MiB -- and so
# puts the vendor default 1.97 MiB INSIDE U-Boot. Overriding the offset worked
# around that; moving uboot to Rockchip's 8 MiB (2026-09-25) removed the reason,
# along with a second collision the old layout had with vendor storage at 3.5 MiB.
# See meta-microduck/files/wic/microduck-ab.wks.in.
#
# The wks's uboot_env partition, this offset and fw_env.config must describe the
# same 32 KiB; scripts/check-wks-layout.py fails if they do not.
CONFIG_ENV_OFFSET=0x3f8000
CONFIG_ENV_SIZE=0x8000

# No CONFIG_ENV_OFFSET_REDUND. Two reasons, and the second is the real one:
#
#   1. Room is not the issue: Rockchip's table leaves 4..8 MiB unused, right after
#      the environment, so a second copy would fit.
#   2. It would only half-work. env_blk.c tests CONFIG_ENV_OFFSET_REDUND directly
#      and would use the backup, but the generic core (env/env.c:138,167,316) gates
#      redundancy on CONFIG_SYS_REDUNDAND_ENVIRONMENT, which include/environment.h
#      auto-#defines for FLASH, MMC, NAND and UBI only -- there is no BLK_DEV case
#      (2017.09). The two halves would disagree about whether the env is redundant.
#
# Accept a single copy: a torn write during `fw_setenv` loses the env, U-Boot falls
# back to the compiled-in default, and BOOT_ORDER reseeds to "A B" on the next boot.
# Degraded to "always try A first", not bricked.

# RAUC's boot script decrements BOOT_<slot>_LEFT with setexpr, and rk3568_defconfig
# turns the command OFF explicitly (configs/rk3568_defconfig:76,
# "# CONFIG_CMD_SETEXPR is not set") against a Kconfig default of y. Without it the
# retry counter cannot be decremented and a failing slot retries forever.
CONFIG_CMD_SETEXPR=y
