# RAUC's view of this board. Installed to /usr/lib/rauc/system.conf -- note that
# is where meta-rauc's wrynose rauc-conf.bb puts it (${nonarch_libdir}/rauc),
# not the /etc/rauc/ that most RAUC documentation and the upstream Yocto
# rk-rauc-demo still say.
[system]
compatible=@MACHINE@

# Where RAUC keeps its own bookkeeping: which bundle went into which slot, the
# install history, whether a slot was marked good. Without this it falls back to
# a status file *inside each slot*, warns "System status information not
# supported", and forgets everything about a slot the moment that slot is
# rewritten. The data partition is mounted at /var/lib/robot for exactly the
# kind of state that must outlive a slot switch, and this is that kind of state.
#
# rauc creates the directory itself; the mount unit only has to be up first,
# which local-fs.target guarantees for anything started after it.
data-directory=/var/lib/robot/rauc

# Slot switching goes through U-Boot. RAUC's uboot backend reads and writes
# BOOT_ORDER and BOOT_<bootname>_LEFT with fw_printenv/fw_setenv (installed by
# recipes-bsp/u-boot-env/), and the boot script prepended to U-Boot's bootcmd
# (recipes-bsp/u-boot/files/0001-*.patch) turns them into
# root=PARTLABEL=rootfs_a|b rauc.slot=A|B on the kernel command line.
#
# rauc.slot= is what RAUC uses to know which slot booted; it is also the
# condition rauc-mark-good.service waits for (ConditionKernelCommandLine=
# |rauc.slot), so that unit -- enabled since stage 1 but always skipped -- now
# runs on every boot that reaches boot-complete.target, and restores the slot's
# attempt counter. Without it BOOT_A_LEFT would drain to 0 in three boots and
# fall over to a slot that may not exist.
#
# Stage 1 shipped `noop`, honestly: the board then had no way to choose a slot
# at boot, because root= was compiled into the DTB. The chosen-node patch no
# longer carries one; see its comment for why a root= there would pin every boot.
bootloader=uboot

# Refuse legacy unsigned-payload 'plain' bundles; we only ever build 'verity'.
bundle-formats=-plain

[keyring]
# Absolute. A relative path would resolve against this file's directory, which
# happens to be the same place, but saying so is free.
path=/usr/lib/rauc/ca.cert.pem

# Slots are addressed by partition label, never by number -- see
# files/wic/microduck-ab.wks.in. bootname A/B is what U-Boot's boot script
# matches in BOOT_ORDER and passes back as rauc.slot=; they must agree exactly.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B
