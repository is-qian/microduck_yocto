# RAUC's view of this board. Installed to /usr/lib/rauc/system.conf -- note that
# is where meta-rauc's wrynose rauc-conf.bb puts it (${nonarch_libdir}/rauc),
# not the /etc/rauc/ that most RAUC documentation and the upstream Yocto
# rk-rauc-demo still say.
[system]
compatible=@MACHINE@

# STAGE 1: no slot switching yet.
#
# This board has no boot-time slot selection mechanism at all: root= is compiled
# into the DTB (recipes-kernel/linux/patches/0001-*-restore-chosen-bootargs.patch)
# which is packed inside an Android boot.img on a raw partition. There is no
# extlinux, no U-Boot bootargs env, no cmdline in the boot.img header. So RAUC
# can write the inactive slot but cannot make the board boot it.
#
# 'noop' says exactly that: rauc install still resolves the booted slot, picks
# the other one and writes it, and logs "noop bootloader: ignore setting slot
# rootfs.1 as primary" instead of pretending. `rauc status` will report an
# unknown boot state per slot, because bootchooser.c has no noop branch for
# get-state -- that is the honest answer here, not a bug.
#
# Stage 2 replaces this single word with 'uboot' once a writable U-Boot
# environment and a boot.scr exist. The slot definitions below do not change.
bootloader=noop

# Refuse legacy unsigned-payload 'plain' bundles; we only ever build 'verity'.
bundle-formats=-plain

[keyring]
# Absolute. A relative path would resolve against this file's directory, which
# happens to be the same place, but saying so is free.
path=/usr/lib/rauc/ca.cert.pem

# Slots are addressed by partition label, never by number -- see
# files/wic/microduck-ab.wks.in. bootname A/B is unused while bootloader=noop
# and is the name the stage 2 boot.scr will match on BOOT_ORDER.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B
