# RAUC's view of this board. Installed to /usr/lib/rauc/ -- where meta-rauc's
# wrynose puts it, not the /etc/rauc/ most RAUC docs say. docs/agents/rauc.md.
[system]
compatible=@MACHINE@

# On the data partition, so RAUC's slot bookkeeping survives the slot it describes
# being rewritten.
data-directory=/var/lib/robot/rauc

# BOOT_ORDER and BOOT_<bootname>_LEFT via fw_printenv/fw_setenv; U-Boot's boot
# script (recipes-bsp/u-boot/) turns them into root= and rauc.slot=, and
# rauc-mark-good.service restores the counter on every boot that completes.
bootloader=uboot

# Only verity bundles are ever built; refuse the legacy unsigned-payload format.
bundle-formats=-plain

[keyring]
path=/usr/lib/rauc/ca.cert.pem

# bootname must match what the boot script looks for in BOOT_ORDER.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs_b
type=ext4
bootname=B
