# Keep NetworkManager's connection profiles -- wifi credentials above all -- on
# the persistent data partition, not in the rootfs.
#
# The default, /etc/NetworkManager/system-connections, lives in the RAUC slot, and
# a slot is replaced wholesale by an update. Found on hardware 2026-09-29: after
# the first A->B update the board booted B perfectly and was unreachable, because
# B was written from a clean image with no profile. It looked exactly like a boot
# failure, and cost two power-cycles and a Bluetooth provisioning to tell apart.
# A robot in the field would have dropped off the network on its first update.
#
# /var/lib/robot is the data partition (recipes-core/microduck-data), which no
# slot touches. Every profile lands here however it is created -- configd over
# Bluetooth, nmcli, or a keyfile dropped on the card by utils/seed-wifi.sh --
# because NetworkManager reads and writes only this directory once path= is set.
#
# /usr/lib/NetworkManager/conf.d is read by NetworkManager 1.56 as the vendor
# config directory, below /etc/NetworkManager/conf.d, so an admin can still
# override it on a board. Checked on the board with `NetworkManager --print-config`.
[keyfile]
path=/var/lib/robot/network
