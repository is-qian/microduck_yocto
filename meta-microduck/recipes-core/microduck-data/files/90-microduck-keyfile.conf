# Keep NetworkManager's connection profiles on the data partition, not in the RAUC
# slot: a slot is replaced wholesale by an update, and a robot whose wifi profile
# lived in it dropped off the network on its first update (2026-09-29). Every
# profile lands here however it is created -- configd over Bluetooth, nmcli, or
# utils/seed-wifi.sh. /usr/lib/NetworkManager/conf.d sits below /etc, so a board
# can still override it.
[keyfile]
path=/var/lib/robot/network
