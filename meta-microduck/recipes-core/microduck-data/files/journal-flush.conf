# systemd-journal-flush.service waits on RequiresMountsFor=/var/log/journal, which
# systemd matches as a string and never resolves through oe-core's /var/log ->
# volatile/log symlink. Without this, the flush can race the bind mount and move
# the early-boot journal into the tmpfs underneath it.
[Unit]
RequiresMountsFor=/var/volatile/log/journal
